<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#07111E">

<script>document.documentElement.classList.add('js')</script>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Manrope:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#07111E;--bg2:#0B1A2C;--card:#0F2035;--line:#1C3149;--tx:#E7EEF6;--mute:#8CA0B5;--teal:#4FD1C5;--sand:#E8CF98}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--tx);font:400 1rem/1.7 Manrope,'IBM Plex Sans Arabic',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
[dir=rtl] body{font-family:'IBM Plex Sans Arabic',Manrope,system-ui,sans-serif}
h1,h2,h3,p{margin:0}
h1,h2{font:400 clamp(2.4rem,6.4vw,5rem)/1.04 Newsreader,'IBM Plex Sans Arabic',Georgia,serif;letter-spacing:-.02em}
h2{font-size:clamp(1.9rem,4.2vw,3.2rem);max-width:20ch}
[dir=rtl] h1,[dir=rtl] h2{font-family:'IBM Plex Sans Arabic',sans-serif;font-weight:600;letter-spacing:0;line-height:1.35}
em{font-style:italic;color:var(--teal)}
[dir=rtl] em{font-style:normal}
h3{font:600 1.15rem/1.3 Manrope,'IBM Plex Sans Arabic',sans-serif}
a{color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px}
.mono{font:500 .78rem 'JetBrains Mono',monospace;color:var(--sand);letter-spacing:.04em}

/* moving wallpaper */
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.orb{position:fixed;z-index:0;border-radius:50%;filter:blur(90px);pointer-events:none;opacity:.55}
.o1{width:46vmax;height:46vmax;top:-18vmax;inset-inline-end:-12vmax;background:radial-gradient(circle,rgba(79,209,197,.35),transparent 65%);animation:d1 26s ease-in-out infinite alternate}
.o2{width:40vmax;height:40vmax;bottom:-16vmax;inset-inline-start:-12vmax;background:radial-gradient(circle,rgba(37,99,235,.35),transparent 65%);animation:d2 32s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(-14vmax,16vmax) scale(1.15)}}
@keyframes d2{to{transform:translate(16vmax,-12vmax) scale(1.1)}}
#pg{position:fixed;top:0;inset-inline:0;height:2px;background:linear-gradient(90deg,var(--teal),var(--sand));transform-origin:0 50%;transform:scaleX(0);z-index:20}
[dir=rtl] #pg{transform-origin:100% 50%}
header,main,footer{position:relative;z-index:1}

/* header */
header{position:sticky;top:0;z-index:10;background:rgba(7,17,30,.72);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:14px 26px;flex-wrap:wrap;min-height:68px;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:700;font-size:1.1rem}
.brand img{height:36px;width:auto}
.bm{display:none;place-items:center;width:36px;height:36px;border-radius:9px;background:var(--teal);color:var(--bg);font-weight:800}
.brand i{font-style:normal;color:var(--mute);font-weight:500}
nav{display:flex;gap:26px;margin-inline-start:auto;font-size:.9rem;color:var(--mute)}
nav a{text-decoration:none;position:relative;padding-block:4px}
nav a::after{content:"";position:absolute;inset-inline:0;bottom:0;height:1px;background:var(--teal);transform:scaleX(0);transition:transform .3s}
nav a:hover{color:var(--tx)}nav a:hover::after{transform:scaleX(1)}
.pill{display:flex;align-items:center;gap:8px;padding:6px 14px;border:1px solid var(--line);border-radius:99px;font-size:.8rem;text-decoration:none}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--teal);animation:pu 2s infinite}
@keyframes pu{0%{box-shadow:0 0 0 0 rgba(79,209,197,.5)}100%{box-shadow:0 0 0 10px rgba(79,209,197,0)}}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{border:0;background:none;padding:6px 10px;font:600 .78rem Manrope,sans-serif;color:var(--mute);cursor:pointer}
.lang button[aria-pressed=true]{background:var(--tx);color:var(--bg)}
@media(max-width:900px){nav{order:5;width:100%;margin:0;overflow-x:auto;white-space:nowrap}.pill{display:none}.lang{margin-inline-start:auto}}

/* reveal */
html.js .rv{opacity:0;transform:translateY(30px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
html.js .rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){html.js .rv{opacity:1;transform:none;transition:none}.o1,.o2,.pill::before{animation:none}html{scroll-behavior:auto}}

/* hero */
.hero{min-height:calc(100svh - 68px);display:flex;align-items:center;padding:80px 0}
.hero .mono{display:block;margin-bottom:26px}
.hero h1{max-width:15ch}
[dir=rtl] .hero h1{max-width:20ch}
.hero p.sub{margin:30px 0 38px;max-width:54ch;font-size:1.18rem;color:var(--mute)}
.acts{display:flex;gap:14px;flex-wrap:wrap}
.btn{display:inline-block;padding:14px 26px;border-radius:8px;background:var(--teal);color:var(--bg);font:700 .95rem Manrope,'IBM Plex Sans Arabic',sans-serif;text-decoration:none;border:0;cursor:pointer;transition:transform .2s,background .2s}
.btn:hover{background:#7FE3D9;transform:translateY(-2px)}
.btn.o{background:none;color:var(--tx);border:1px solid var(--line)}.btn.o:hover{border-color:var(--teal);background:none}

/* ticker */
.ticker{direction:ltr;overflow:hidden;border-block:1px solid var(--line);background:rgba(11,26,44,.7);backdrop-filter:blur(6px);padding:16px 0}
.track{display:flex;gap:44px;width:max-content;animation:tk 70s linear infinite;color:var(--mute);font-size:.95rem;white-space:nowrap}
.track span::after{content:"·";margin-inline-start:44px;color:var(--teal)}
@keyframes tk{to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){.track{animation:none}}

/* sections */
section{padding:100px 0;border-bottom:1px solid var(--line)}
section.alt{background:rgba(11,26,44,.6);backdrop-filter:blur(6px)}
.head{display:grid;gap:14px;margin-bottom:46px}
.lead{max-width:60ch;color:var(--mute);font-size:1.05rem}
.grid{display:grid;gap:22px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:960px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.g2,.g3,.g4{grid-template-columns:1fr}}
.card{background:rgba(15,32,53,.82);border:1px solid var(--line);border-radius:14px;padding:30px}
.card p{margin-top:8px;color:var(--mute);font-size:.95rem}
.pr{border-top:2px solid var(--teal);border-radius:0 0 14px 14px}

/* services */
.sv{position:relative;overflow:hidden;padding:36px;transition:transform .3s,border-color .3s}
.sv::before{content:"";position:absolute;inset:0;background:radial-gradient(380px circle at var(--mx,50%) var(--my,0%),rgba(79,209,197,.17),transparent 60%);opacity:0;transition:opacity .3s}
.sv:hover{transform:translateY(-4px);border-color:#2B5A66}.sv:hover::before{opacity:1}
.sv>*{position:relative}
.sv .n{display:block;font:400 3.4rem/1 Newsreader,serif;color:var(--sand);margin-bottom:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.chips span{font-size:.8rem;color:var(--teal);border:1px solid #1F5A56;border-radius:99px;padding:4px 13px;background:rgba(79,209,197,.06)}

/* mentors */
.ment{text-align:center}
.av{position:relative;width:82px;height:82px;margin:0 auto 16px;border-radius:50%;background:#12304A;color:var(--teal);display:grid;place-items:center;font-weight:700;overflow:hidden}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ment h3{font-size:.98rem}.ment p{font-size:.86rem}

/* contact */
form{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:760px}
form .f{grid-column:1/-1}
@media(max-width:620px){form{grid-template-columns:1fr}}
label{display:block;font-size:.82rem;color:var(--mute);margin-bottom:6px}
input,select,textarea{width:100%;padding:13px 14px;background:rgba(15,32,53,.9);border:1px solid var(--line);border-radius:8px;color:var(--tx);font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--teal);border-color:var(--teal)}
form small{color:var(--mute);align-self:center}
footer{padding:30px 0;color:var(--mute);font-size:.88rem;background:rgba(7,17,30,.8)}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="orb o1" aria-hidden="true"></div><div class="orb o2" aria-hidden="true"></div>
<canvas id="bg" aria-hidden="true"></canvas>
<div id="pg"></div>

<header>
  <div class="wrap">
    <a class="brand" href="#top">
      <img src="assets/logo.png" alt="AMOY" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">
      <span class="bm">A</span><span>AMOY <i>Consultancy</i></span>
    </a>
    <nav aria-label="Main"><a href="#services" data-i="n1"></a><a href="#approach" data-i="n2"></a><a href="#mentors" data-i="n3"></a><a href="#contact" data-i="n4"></a></nav>
    <a class="pill" href="#contact" data-i="pill"></a>
    <div class="lang" role="group" aria-label="Language"><button data-l="en" title="English">EN</button><button data-l="tr" title="Türkçe">TR</button><button data-l="ar" title="العربية">AR</button></div>
  </div>
</header>

<main id="top">
<div class="hero">
  <div class="wrap">
    <span class="mono rv" data-i="eyebrow"></span>
    <h1 class="rv" style="--d:.1s" data-i="h1" data-h></h1>
    <p class="sub rv" style="--d:.25s" data-i="hsub"></p>
    <div class="acts rv" style="--d:.4s"><a class="btn" href="#contact" data-i="hb1"></a><a class="btn o" href="#services" data-i="hb2"></a></div>
  </div>
</div>
<div class="ticker" aria-hidden="true"><div class="track" id="track"></div></div>

<section id="services">
  <div class="wrap">
    <div class="head rv"><span class="mono">01 / 04</span><h2 data-i="s_t" data-h></h2></div>
    <div class="grid g2">
      <article class="card sv rv"><span class="n">A</span><h3 data-i="sA_t"></h3><p data-i="sA_d"></p><div class="chips"><span data-i="a1"></span><span data-i="a2"></span></div></article>
      <article class="card sv rv" style="--d:.1s"><span class="n">B</span><h3 data-i="sB_t"></h3><p data-i="sB_d"></p><div class="chips"><span data-i="b1"></span><span data-i="b2"></span></div></article>
      <article class="card sv rv"><span class="n">C</span><h3 data-i="sC_t"></h3><p data-i="sC_d"></p><div class="chips"><span data-i="c1"></span><span data-i="c2"></span></div></article>
      <article class="card sv rv" style="--d:.1s"><span class="n">D</span><h3 data-i="sD_t"></h3><p data-i="sD_d"></p><div class="chips"><span data-i="d1"></span><span data-i="d2"></span></div></article>
    </div>
  </div>
</section>

<section id="approach" class="alt">
  <div class="wrap">
    <div class="head rv"><span class="mono">02 / 04</span><h2 data-i="pc_t" data-h></h2><p class="lead" data-i="pc_s"></p></div>
    <div class="grid g3">
      <article class="card pr rv"><h3 data-i="pc1_t"></h3><p data-i="pc1_d"></p></article>
      <article class="card pr rv" style="--d:.1s"><h3 data-i="pc2_t"></h3><p data-i="pc2_d"></p></article>
      <article class="card pr rv" style="--d:.2s"><h3 data-i="pc3_t"></h3><p data-i="pc3_d"></p></article>
    </div>
    <div class="rv" style="margin-top:44px">
      <h3 data-i="em_t" style="margin-bottom:20px"></h3>
      <div class="grid g3">
        <article class="card"><h3 data-i="em1_t"></h3><p data-i="em1_d"></p></article>
        <article class="card"><h3 data-i="em2_t"></h3><p data-i="em2_d"></p></article>
        <article class="card"><h3 data-i="em3_t"></h3><p data-i="em3_d"></p></article>
      </div>
    </div>
  </div>
</section>

<section id="mentors">
  <div class="wrap">
    <div class="head rv"><span class="mono">03 / 04</span><h2 data-i="me_t" data-h></h2><p class="lead" data-i="me_s"></p></div>
    <div class="grid g4">
      <article class="card ment rv"><div class="av"><span>EG</span><img src="assets/mentors/ender-gurgen.jpg" alt="" onerror="this.remove()"></div><h3>Dr. Öğr. Üyesi Ender Gürgen</h3><p data-i="me1"></p></article>
      <article class="card ment rv" style="--d:.08s"><div class="av"><span>TA</span><img src="assets/mentors/tevfik-aytemiz.jpg" alt="" onerror="this.remove()"></div><h3>Prof. Dr. Tevfik Aytemiz</h3><p data-i="me2"></p></article>
      <article class="card ment rv" style="--d:.16s"><div class="av"><span>AŞ</span><img src="assets/mentors/ayse-sahin.jpg" alt="" onerror="this.remove()"></div><h3>Prof. Dr. Ayşe Şahin</h3><p data-i="me3"></p></article>
      <article class="card ment rv" style="--d:.24s"><div class="av"><span>ÜD</span><img src="assets/mentors/umit-dogrul.jpg" alt="" onerror="this.remove()"></div><h3>Dr. Öğr. Üyesi Ümit Doğrul</h3><p data-i="me4"></p></article>
    </div>
  </div>
</section>

<section id="contact" class="alt">
  <div class="wrap">
    <div class="head rv"><span class="mono">04 / 04</span><h2 data-i="c_t" data-h></h2><p class="lead" data-i="c_s"></p></div>
    <form id="f" class="rv">
      <div><label for="n" data-i="f1"></label><input id="n" required autocomplete="name"></div>
      <div><label for="c" data-i="f2"></label><input id="c" required autocomplete="organization"></div>
      <div class="f"><label for="e" data-i="f3"></label><input id="e" type="email" required autocomplete="email"></div>
      <div class="f"><label for="t" data-i="f4"></label><select id="t"><option data-i="o1"></option><option data-i="o2"></option><option data-i="o3"></option><option data-i="o4"></option><option data-i="o5"></option></select></div>
      <div class="f"><label for="m" data-i="f5"></label><textarea id="m" rows="4"></textarea></div>
      <button class="btn" type="submit" data-i="f6"></button><small data-i="f7"></small>
      <small class="f" data-i="f8" style="color:var(--mute);font-size:.8rem"></small>
    </form>
  </div>
</section>
</main>

<footer><div class="wrap"><span>© 2026 AMOY Consultancy · <span data-i="ft1"></span></span><span data-i="ft2"></span></div></footer>

const tk=['sA_t','a1','a2','sB_t','b1','b2','sC_t','c1','c2','sD_t','d1','d2'];
document.getElementById('track').innerHTML=[0,1].map(()=>tk.map(k=>`<span data-i="${k}"></span>`).join('')).join('');
let cur='en';
function setLang(l){
  cur=l;const t=T[l],d=document.documentElement;
  d.lang=l;d.dir=l==='ar'?'rtl':'ltr';document.title=t.title;
  document.querySelector('meta[name=description]').content=t.desc;
  document.querySelectorAll('[data-i]').forEach(e=>{const v=t[e.dataset.i];e.dataset.h!==undefined?e.innerHTML=v:e.textContent=v});
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===l));
  try{localStorage.setItem('amoy-lang',l)}catch(e){}
}
document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.l)));
let s='en';
try{s=new URLSearchParams(location.search).get('lang')||localStorage.getItem('amoy-lang')||(navigator.language||'en').slice(0,2)}catch(e){}
setLang(T[s]?s:'en');

// scroll reveal + progress bar
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});
document.querySelectorAll('.rv').forEach(e=>io.observe(e));
const pg=document.getElementById('pg');
addEventListener('scroll',()=>{pg.style.transform=`scaleX(${scrollY/Math.max(1,document.body.scrollHeight-innerHeight)})`},{passive:true});

// service card spotlight
document.querySelectorAll('.sv').forEach(c=>c.addEventListener('pointermove',e=>{const r=c.getBoundingClientRect();c.style.setProperty('--mx',e.clientX-r.left+'px');c.style.setProperty('--my',e.clientY-r.top+'px')}));

// moving network wallpaper
(()=>{
  const c=document.getElementById('bg'),x=c.getContext('2d'),rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
  let w,h,P=[],m={x:-999,y:-999};
  function size(){
    const d=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*d;c.height=h*d;x.setTransform(d,0,0,d,0,0);
    P=Array.from({length:Math.round(Math.min(95,w*h/15000))},(_,i)=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,r:Math.random()*1.5+.8,s:i%8===0}));
  }
  function frame(){
    x.clearRect(0,0,w,h);
    for(const p of P){
      p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;
      const dx=p.x-m.x,dy=p.y-m.y;if(dx*dx+dy*dy<14000){p.x+=dx*.01;p.y+=dy*.01}
    }
    for(let i=0;i<P.length;i++){
      const a=P[i];x.fillStyle=a.s?'rgba(232,207,152,.85)':'rgba(79,209,197,.75)';
      x.beginPath();x.arc(a.x,a.y,a.r,0,6.283);x.fill();
      for(let j=i+1;j<P.length;j++){
        const b=P[j],dx=a.x-b.x,dy=a.y-b.y,d=dx*dx+dy*dy;
        if(d<24000){x.strokeStyle=`rgba(79,209,197,${.2*(1-d/24000)})`;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}
      }
      const mx=a.x-m.x,my=a.y-m.y,md=mx*mx+my*my;
      if(md<30000){x.strokeStyle=`rgba(232,207,152,${.35*(1-md/30000)})`;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(m.x,m.y);x.stroke()}
    }
    if(!rm)requestAnimationFrame(frame);
  }
  let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{size();if(rm)frame()},150)});
  addEventListener('pointermove',e=>{m.x=e.clientX;m.y=e.clientY},{passive:true});
  addEventListener('pointerleave',()=>{m.x=m.y=-999});
  size();frame();
})();

// contact form
document.getElementById('f').addEventListener('submit',e=>{
  e.preventDefault();
  const v=id=>document.getElementById(id),x=T[cur];
  const body=`${x.f1}: ${v('n').value}\n${x.f2}: ${v('c').value}\n${x.f3}: ${v('e').value}\n${x.f4} ${v('t').selectedOptions[0].textContent}\n\n${v('m').value}`;
  location.href=`mailto:${MAIL}?subject=${encodeURIComponent('AMOY free diagnostic request')}&body=${encodeURIComponent(body)}`;
});
